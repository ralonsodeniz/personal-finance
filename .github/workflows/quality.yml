name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Root quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @personal-finance/web exec playwright install chromium

      - name: Run the full root and preview delivery verification flow
        run: pnpm run verify

      - name: Run the affected-workspace verification flow
        if: github.event_name == 'pull_request'
        run: pnpm run verify:affected
