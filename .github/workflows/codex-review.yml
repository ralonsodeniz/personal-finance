name: Codex review

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  issue_comment:
    types:
      - created
      - edited
      - deleted
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: >-
    codex-review-${{
      github.event_name == 'pull_request_review' && github.run_id ||
      github.event_name == 'pull_request_review_comment' && github.run_id ||
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Recompute current Codex review state
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main-branch support code
        uses: actions/checkout@v4
        with:
          repository: ralonsodeniz/personal-finance
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Publish Codex review status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/codex-review.mjs
