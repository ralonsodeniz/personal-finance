packages:
  - apps/*
  - packages/*

minimumReleaseAge: 4320
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade

# Babel's semver 6 dependency resolves to a registry release without the
# provenance evidence required by the no-downgrade policy. semver 7 preserves
# the API used by the toolchain and has trusted provenance.
overrides:
  semver: 7.8.5

allowBuilds:
  "@swc/core": true
  core-js: false
  esbuild: true
